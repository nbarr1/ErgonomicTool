name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linting, formatting, type checks, and the transcription check.
  # Later milestones add jobs as soon as they have something to check (decision D-014):
  # published-example tests (milestone 2) and end-to-end tests and automated
  # accessibility checks (milestone 4).
  static-checks:
    name: Lint, format, type check, and transcriptions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:transcriptions

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux x64, macOS arm64, and Windows x64: at least two operating systems and two
        # processor architectures, as part 2 of the build prompt requires.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # Cross-platform determinism run: each platform parses every reconciled table and writes its
  # output, and the compare job fails if any output differs or fewer than two operating systems
  # or two processor architectures ran. Milestone 2 extends the output to every engine fixture.
  determinism-run:
    name: Determinism run (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: mkdir -p determinism-output
        shell: bash
      - run: node tools/determinism/cli.ts emit determinism-output/${{ matrix.os }}.json
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: determinism-output/${{ matrix.os }}.json
          if-no-files-found: error

  determinism-compare:
    name: Determinism comparison
    needs: determinism-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          path: determinism-output
          merge-multiple: true
      - run: node tools/determinism/cli.ts compare determinism-output/*.json
