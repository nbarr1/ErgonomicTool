name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linting, formatting, and type checks.
  # Later milestones add jobs here as soon as they have something to check (decision D-014):
  # unit and published-example tests and the cross-platform determinism run (milestones 1-2),
  # end-to-end tests and automated accessibility checks (milestone 4).
  static-checks:
    name: Lint, format, and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
